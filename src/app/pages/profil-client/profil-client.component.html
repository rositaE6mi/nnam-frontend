<div class="max-w-3xl mx-auto px-4 py-8">
  <!-- Titre -->
  <h1 class="text-3xl font-bold mb-6 text-nnam-orange">Mon Profil</h1>

  <!-- Chargement -->
  <ng-container *ngIf="profil; else loading">
    <div class="bg-white rounded-lg shadow p-6">

      <!-- Informations du profil -->
      <div class="flex items-center space-x-4 mb-6">
        <div class="bg-nnam-green text-white rounded-full w-20 h-20 flex items-center justify-center text-3xl">
          <i class="fas fa-user"></i>
        </div>
        <div>
          <h2 class="text-xl font-bold">{{ profil.nomProfil }}</h2>
          <p class="text-gray-600">{{ profil.zoneGeographique }}</p>
        </div>
      </div>

      <!-- Formulaire modification -->
      <form *ngIf="isEditing" (ngSubmit)="saveChanges()" class="space-y-4">
        <div>
          <label class="block text-gray-700 font-medium mb-1">Nom du Profil</label>
          <input [(ngModel)]="profil.nomProfil" name="nomProfil" class="form-input w-full" required>
        </div>

        <div>
          <label class="block text-gray-700 font-medium mb-1">Zone Géographique</label>
          <input [(ngModel)]="profil.zoneGeographique" name="zoneGeographique" class="form-input w-full" required>
        </div>

        <div class="flex space-x-2">
          <button type="submit" class="bg-nnam-green hover:bg-green-700 text-white px-4 py-2 rounded">Enregistrer</button>
          <button type="button" (click)="isEditing = false" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded">Annuler</button>
        </div>
      </form>

      <!-- Boutons action -->
      <div *ngIf="!isEditing" class="flex space-x-2">
        <button (click)="isEditing = true" class="bg-nnam-orange hover:bg-orange-600 text-white px-4 py-2 rounded">Modifier</button>
        <button (click)="deleteAccount()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded">Supprimer le compte</button>
      </div>
    </div>
  </ng-container>

  <!-- Template chargement -->
  <ng-template #loading>
    <div class="text-center text-gray-600">
      <i class="fas fa-spinner fa-spin text-2xl"></i>
      <p>Chargement du profil...</p>
    </div>
  </ng-template>

  <!-- Déconnexion -->
  <div class="mt-8 text-center">
    <button (click)="logout()" class="bg-nnam-brown hover:bg-brown-800 text-white px-6 py-3 rounded">Déconnexion</button>
  </div>
</div>
