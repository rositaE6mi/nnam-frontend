<div class="login-container">
  <h2 class="login-title brown-title">Connexion Agriculteur</h2>

  <form (ngSubmit)="login()" #formRef="ngForm">
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" name="email" [(ngModel)]="credentials.email" type="email" required class="form-control">
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" [(ngModel)]="credentials.password" type="password" required class="form-control">
    </div>

    <button type="submit" class="btn btn-primary">Se connecter</button>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>

    <p class="forgot-password" (click)="motDePasseOublie()">Mot de passe oublié ?</p>
  </form>
</div>
