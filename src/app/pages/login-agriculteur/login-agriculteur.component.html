<div class="container mt-5">
  <h2 class="text-success text-center mb-4">Connexion Agriculteur</h2>

  <form (ngSubmit)="login()" #formRef="ngForm">
    <div class="mb-3">
      <label for="email">Email</label>
      <input id="email" name="email" class="form-control" [(ngModel)]="credentials.email" type="email" required />
    </div>

    <div class="mb-3">
      <label for="password">Mot de passe</label>
      <input id="password" name="password" class="form-control" [(ngModel)]="credentials.password" type="password" required />
    </div>

    <button type="submit" class="btn btn-success w-100">
      <i class="fas fa-sign-in-alt me-2"></i>Se connecter
    </button>

    <div *ngIf="errorMessage" class="alert alert-danger mt-3">
      {{ errorMessage }}
    </div>
  </form>
</div>
