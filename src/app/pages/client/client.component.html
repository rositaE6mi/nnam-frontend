<div class="max-w-7xl mx-auto px-4 py-8">
  <!-- En-tête -->
  <div class="bg-nnam-orange text-white rounded-lg p-6 mb-8">
    <h1 class="text-3xl font-bold mb-2">Espace Client</h1>
    <p class="text-orange-100">Découvrez nos produits frais et locaux</p>
  </div>

  <!-- Filtres -->
<div class="bg-white rounded-lg shadow p-6 mb-8">
  <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
    <div>
      <label class="block text-gray-700 font-medium mb-2">Rechercher</label>
      <input [(ngModel)]="filtreNom" type="text" class="form-input" placeholder="Nom du produit...">
    </div>
    <div>
      <label class="block text-gray-700 font-medium mb-2">Catégorie</label>
      <select [(ngModel)]="filtreCategorie" class="form-input">
        <option value="">Toutes les catégories</option>
        <option *ngFor="let categorie of categories" [value]="categorie.idCat">{{ categorie.nomCat }}</option>
      </select>
    </div>
    <div>
      <label class="block text-gray-700 font-medium mb-2">Prix Max (FCFA)</label>
      <input type="number" [(ngModel)]="filtrePrix" class="form-input" placeholder="5000">
    </div>
  </div>
</div>

  <!-- Infos panier -->
  <div class="bg-nnam-green text-white rounded-lg p-4 mb-8 flex justify-between items-center">
    <div class="flex items-center">
      <i class="fas fa-shopping-cart mr-3 text-xl"></i>
      <span class="font-semibold">Articles dans le panier: {{ totalMontant }}</span>
    </div>
  </div>

  <!-- Catalogue -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
    <div *ngFor="let p of getProduitsFiltres()" class="product-card bg-white rounded-lg shadow-md overflow-hidden">
      <a [routerLink]="['/product-detail', p.idProduit]">
        <div class="h-48 bg-gradient-to-br flex items-center justify-center">
          <i class="fas fa-carrot text-white text-6xl"></i>
        </div>
        <div class="p-4">
          <h3 class="font-semibold text-nnam-brown">{{ p.nomProduit }}</h3>
          <p class="text-gray-600 text-sm" *ngIf="p.stock.quantiteStock > 0">Stock: {{ p.stock.quantiteStock }}kg disponibles</p>
          <p class="text-red-600 text-sm font-medium" *ngIf="p.stock.quantiteStock === 0">Rupture de stock</p>
          <div class="flex justify-between items-center mt-4">
            <span class="text-nnam-orange font-bold text-lg">{{ p.prixU }} FCFA/kg</span>
            <div class="flex items-center space-x-2" *ngIf="p.stock.quantiteStock > 0">
              <button class="bg-nnam-green text-white px-3 py-1 rounded hover:bg-green-600 transition" (click)="ajouterAuPanier(p)">
                <i class="fas fa-cart-plus"></i>
              </button>
            </div>
            <button *ngIf="p.stock.quantiteStock === 0" disabled class="bg-gray-400 text-white px-3 py-1 rounded cursor-not-allowed">
              Indisponible
            </button>
          </div>
        </div>
      </a>
    </div>
  </div>
</div>
