<div class="max-w-7xl mx-auto px-4 py-8">
  <!-- En-tête -->
  <div class="bg-nnam-green text-white rounded-lg p-6 mb-8">
    <h1 class="text-3xl font-bold mb-2">Espace Agriculteur</h1>
    <p class="text-green-100">Gérez vos produits et suivez vos commandes</p>
  </div>

  <!-- Statistiques -->
  <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
    <div class="bg-white rounded-lg shadow p-6 text-center" *ngFor="let stat of stats">
      <div class="text-3xl font-bold text-nnam-green">{{ stat.valeur }}</div>
      <div class="text-gray-600">{{ stat.libelle }}</div>
    </div>
  </div>

  <!-- Commandes reçues -->
  <div class="bg-white rounded-lg shadow-lg p-6 mt-8">
    <h2 class="text-2xl font-bold text-nnam-brown mb-4">Commandes Reçues</h2>
    
    <div *ngIf="commandes.length === 0" class="text-gray-500 italic text-center py-8">
      <i class="fas fa-shopping-cart text-4xl mb-2"></i>
      <p>Aucune commande reçue.</p>
    </div>

    <div *ngIf="commandes.length > 0" class="overflow-x-auto">
      <table class="w-full table-auto min-w-full">
        <thead>
          <tr class="bg-gray-50">
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm">N° Commande</th>
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm">Client</th>
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm hidden sm:table-cell">Produits</th>
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm">Montant</th>
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm">Statut</th>
            <th class="px-2 sm:px-4 py-2 text-left text-xs sm:text-sm">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let c of commandes" class="hover:bg-gray-50">
            <td class="px-2 sm:px-4 py-2 text-xs sm:text-sm">#{{ c.id }}</td>
            <td class="px-2 sm:px-4 py-2 text-xs sm:text-sm">{{ c.client }}</td>
            <td class="px-2 sm:px-4 py-2 text-xs sm:text-sm hidden sm:table-cell">{{ c.produits }}</td>
            <td class="px-2 sm:px-4 py-2 text-xs sm:text-sm font-semibold">{{ c.total | number }} FCFA</td>
            <td class="px-2 sm:px-4 py-2">
              <span class="bg-yellow-100 text-yellow-800 px-2 py-1 rounded text-xs">{{ c.statut }}</span>
            </td>
            <td class="px-2 sm:px-4 py-2">
              <button class="bg-nnam-green text-white px-2 sm:px-3 py-1 rounded text-xs sm:text-sm hover:bg-green-600 transition-colors">
                {{ c.action }}
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Liens vers les pages Ajouter un produit et Afficher tous les produits -->
  <div class="flex justify-center space-x-4 mt-8">
    <button 
      (click)="goToAjouterProduit()" 
      class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 transition-colors">
      <i class="fas fa-plus mr-2"></i> Ajouter un produit
    </button>
    <button 
      (click)="goToListeProduits()" 
      class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600 transition-colors">
      <i class="fas fa-list mr-2"></i> Afficher tous les produits
    </button>
  </div>
</div>
