<div class="container mx-auto max-w-md mt-10 p-4 bg-white rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Mot de passe oublié</h2>
  <form (ngSubmit)="onSubmit()">
    <label for="email" class="block mb-2">Adresse email</label>
    <input type="email" id="email" [(ngModel)]="email" name="email"/>
           class="w-full border rounded px-3 py-2 mb-4" placeholder="Entrez votre email" required />
    <button type="submit" class="bg-nnam-green text-white px-4 py-2 rounded w-full">
      Envoyer le lien de réinitialisation
    </button>
  </form>
</div>
