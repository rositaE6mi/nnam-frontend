<div class="max-w-md mx-auto mt-10">
  <h2 class="text-2xl font-bold mb-4">Se connecter</h2>
  <form (ngSubmit)="login()">
    <div class="mb-4">
      <label class="block text-gray-700">Nom d'utilisateur</label>
      <input type="text" [(ngModel)]="username" name="username" required class="form-control" />
    </div>
    <div class="mb-4">
      <label class="block text-gray-700">Mot de passe</label>
      <input type="password" [(ngModel)]="password" name="password" required class="form-control" />
    </div>
    <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded">Se connecter</button>
  </form>
</div>
