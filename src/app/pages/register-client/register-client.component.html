<div class="container mt-4">
  <h2 class="text-primary text-center mb-4">Inscription Client</h2>

  <form (ngSubmit)="register()" #formRef="ngForm">
    <div class="row mb-3">
      <div class="col-md-6">
        <label>Prénom</label>
        <input class="form-control" [(ngModel)]="client.prenom" name="prenom" required>
      </div>
      <div class="col-md-6">
        <label>Nom</label>
        <input class="form-control" [(ngModel)]="client.nom" name="nom" required>
      </div>
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control" [(ngModel)]="client.email" name="email" required>
    </div>

    <div class="mb-3">
      <label>Mot de passe</label>
      <input type="password" class="form-control" [(ngModel)]="client.password" name="password" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      <i class="fas fa-user-plus me-2"></i>S'inscrire
    </button>

    <div *ngIf="message" class="alert alert-danger mt-3">{{ message }}</div>
  </form>
</div>
