<div class="container mx-auto max-w-md mt-10 p-4 bg-white rounded shadow">
  <h2 class="text-2xl font-bold mb-4">Réinitialiser le mot de passe</h2>
  <form (ngSubmit)="onSubmit()">
    <label for="newPassword" class="block mb-2">Nouveau mot de passe</label>
    <input type="password" id="newPassword" [(ngModel)]="newPassword" name="newPassword"
           class="w-full border rounded px-3 py-2 mb-4" placeholder="Nouveau mot de passe" required />

    <label for="confirmPassword" class="block mb-2">Confirmer le mot de passe</label>
    <input type="password" id="confirmPassword" [(ngModel)]="confirmPassword" name="confirmPassword"
           class="w-full border rounded px-3 py-2 mb-4" placeholder="Confirmez le mot de passe" required />

    <button type="submit" class="bg-nnam-green text-white px-4 py-2 rounded w-full">
      Réinitialiser le mot de passe
    </button>
  </form>
</div>
