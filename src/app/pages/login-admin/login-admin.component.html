<div class="login-container">
  <h2 class="login-title">Connexion Administrateur</h2>
<form (submit)="login()">
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" [(ngModel)]="email" required class="form-control">
  </div>
  <div class="form-group">
    <label for="password">Mot de passe</label>
    <input type="password" id="password" name="password" [(ngModel)]="motDePasse" required class="form-control">
  </div>
  <button type="submit" class="btn btn-primary">Se connecter</button>
</form>
</div>
